// ===== app/build.gradle (module: app) =====

import java.util.Properties
import java.io.FileInputStream

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// --- Optional: load keystore info if android/key.properties exists ---
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.mycompany.kikonnect"   // <-- change if needed
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.mycompany.kikonnect"  // <-- change if needed
        minSdkVersion 26
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Use Java/Kotlin 17
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Keep Gradle quiet about some generated packages in release
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    // If you have a real release keystore, this will be populated.
    // Safe if key.properties is missing (you'll stay on debug signing).
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    // Workaround for Windows + NDK strip issue:
    // 1) do NOT strip symbols from .so files
    packagingOptions {
        // legacy directive that works across AGP versions
        doNotStrip "**/*.so"
    }

    buildTypes {
        release {
            // TODO: when ready to sign for store, switch to:
            // signingConfig signingConfigs.release
            // For now keep debug signing so `flutter run --release` works:
            signingConfig signingConfigs.debug

            // If you use proguard, keep this:
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // 2) also tell the NDK not to produce a separate symbols bundle
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
        debug {
            // No special changes needed here
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

// Flutter toolchain hook (keep as is)
flutter {
    source '../..'
}

dependencies {
    // Required when using Java 17 APIs on older Android API levels
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Kotlin stdlib (modern default)
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

// --- Hard-disable any strip*DebugSymbols tasks (belt & braces) ---
afterEvaluate {
    tasks.configureEach { t ->
        def n = t.name.toLowerCase()
        if (n.contains('strip') && n.contains('debugsymbols')) {
            t.enabled = false
        }
    }
    // Explicit per-ABI task names (seen in some AGP/NDK combos)
    [
            'stripReleaseDebugSymbols',
            'stripReleaseDebugSymbolsArm64-v8a',
            'stripReleaseDebugSymbolsArmeabi-v7a',
            'stripReleaseDebugSymbolsX86',
            'stripReleaseDebugSymbolsX86_64'
    ].each { name ->
        tasks.findByName(name)?.enabled = false
    }
}
