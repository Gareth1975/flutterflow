plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

import java.util.Properties
import java.io.FileInputStream

// ----- Load signing info from android/key.properties -----
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.mycompany.kikonnect"
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.mycompany.kikonnect"
        minSdkVersion 26
        targetSdkVersion 35

        // Bump these before each Play upload
        versionCode 16
        versionName "1.0.1"

        // Force-pack arm64 engine when producing APKs locally (kept harmless for AABs)
        ndk { abiFilters "arm64-v8a" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // IMPORTANT: use release signing
            signingConfig signingConfigs.release

            // Keep shrinking off while stabilising
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Avoid Windows strip issues
            ndk { debugSymbolLevel 'NONE' }
        }
    }

    // Make sure native libs are packaged the classic way
    packagingOptions {
        jniLibs { useLegacyPackaging true }
        doNotStrip "**/*.so"
    }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"
}
